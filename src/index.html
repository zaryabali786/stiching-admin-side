<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Stitch&amp;Ship — Admin &amp; Partner Portal</title>

  <base href="/" />

  <meta name="color-scheme" content="light" />
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />
  <meta name="theme-color" content="#111A15" />

  <link rel="icon" type="image/png" href="assets/icon/favicon.png" />
  <link rel="apple-touch-icon" href="assets/icon/apple-touch-icon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,600&family=Noto+Nastaliq+Urdu:wght@400;600&display=swap" rel="stylesheet">

  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Animated splash (the app on a phone only): the Stitch&Ship logo plays over a white screen until the app is ready (see main.ts). -->
  <script>
    (function () {
      var c = window.Capacitor;
      if (c && c.isNativePlatform && c.isNativePlatform()) document.documentElement.classList.add('native-boot');
    })();
  </script>
  <style>
    #boot-splash { display: none; }
    .native-boot #boot-splash { display: flex; position: fixed; inset: 0; z-index: 2147483000; align-items: center; justify-content: center; overflow: hidden; background: #fff; transition: opacity 0.45s ease; }
    .native-boot #boot-splash.hide { opacity: 0; pointer-events: none; }
    /* the same size as the still picture of the phone's own splash screen, so the two follow each other without a jump */
    #boot-splash img { width: max(35.87vh, 35.87vw); height: auto; max-width: none; flex: none; transform: translate(-0.35%, 1.07%); }
  </style>
</head>

<body>
  <div id="boot-splash" aria-hidden="true"><img src="assets/splash/logoSplash-animated.svg" alt="" draggable="false" /></div>
  <app-root></app-root>
</body>

</html>
